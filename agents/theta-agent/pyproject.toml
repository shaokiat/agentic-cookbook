[project]
name = "theta-agent"
version = "1.0.0"
description = "Multi-strategy options screener orchestrated with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "chainlit>=2.12,<3",
    "pandas",
    "yfinance",
    "python-dotenv",
    "pydantic>=2.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["theta*", "tools*", "graph*"]
