# Scale on queue depth, not CPU.
#
# CPU utilisation on a GPU inference server is close to meaningless — the process can be
# pinned at low CPU while the GPU is saturated. vllm:num_requests_waiting is the signal that
# says the KV cache is full and the scheduler has started queueing, which is exactly the knee
# that examples/07_inference/03_load_sweep.py measures.
#
# Requires a custom-metrics adapter (Managed Service for Prometheus + the custom metrics
# Stackdriver adapter) to expose vLLM's Prometheus metrics to the HPA. Until that is wired up,
# this manifest documents the intent rather than working out of the box.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: vllm}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Pods
      pods:
        metric: {name: vllm_num_requests_waiting}
        target: {type: AverageValue, averageValue: "5"}
  behavior:
    scaleUp:
      # GPU nodes take minutes to come up; reacting to every spike just thrashes.
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
