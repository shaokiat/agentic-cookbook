apiVersion: v1
kind: Service
metadata:
  name: vllm
  labels: {app: vllm}
  annotations:
    # Internal by default. An unauthenticated GPU endpoint on the public internet gets mined.
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector: {app: vllm}
  ports:
    - {name: http, port: 80, targetPort: 8000}
